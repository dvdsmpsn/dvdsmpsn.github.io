<!DOCTYPE html>
<html lang="en">
  <head>
    <!--
      Images sourced from https://www.itsnottingham.info/
      Page reloads every 60 seconds
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <meta http-equiv="refresh" content="60">
    
    <title>👋 Hello Nottingham</title>
    <style>
      body {
        background: #000;
        margin: 0;
        padding: 0;
        text-align: center;
      }
      img {
        width: 360px;
      }
      @media (max-width: 600px) {
        img {
          width: 198px;
        }
      }
    </style>

    <script>
    
      document.addEventListener("DOMContentLoaded", () => {
        const fragment = document.createDocumentFragment();
    
        for (let i = 1; i < 396; i++) {
          const src = `https://data.nottinghamtravelwise.org.uk/images${i}.jpg?_=${Date.now()}`;
    
          const a = document.createElement("a");
          a.target = "_blank";
          a.href = src;
    
          const img = document.createElement("img");
          img.src = src;
    
          a.appendChild(img);
          fragment.appendChild(a);
        }
    
        document.body.appendChild(fragment);
      });
    </script>
  </head>
  <body></body>
</html>
